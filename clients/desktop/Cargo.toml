[package]
name = "widev-desktop-client"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
anyhow = { workspace = true }
quiche = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
wincode = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
strum = { workspace = true }
mio = { version = "1.2.0", features = ["os-poll", "net"] }
winit = "0.30.13"
wgpu = "29.0.3"
pollster = "0.4.0"
bytemuck = { version = "1.25.0", features = ["derive"] }
gilrs = "0.11.1"
muda = "0.19.2"
glyphon = "0.11.0"
png = "0.18.1"
futures = "0.3"
if-watch = { version = "=3.2.2", features = ["smol"] }
smol = "2"

[build-dependencies]
anyhow = { workspace = true }
protocol_codegen = { path = "../../common/protocol_codegen" }
