[workspace]
members = [
  "server",
  "clients/desktop",
  "clients/desktop-bots",
  "common/protocol_codegen",
  "xtask",
]
resolver = "2"

[workspace.package]
edition = "2024"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wincode = { version = "0.5.4", features = ["derive"] }
rand = "0.10"
quiche = "0.29"
anyhow = "1"
rcgen = "0.14"
clap = { version = "4.6", features = ["derive"] }
sha2 = "0.11"
log = "0.4"
env_logger = "0.11"
libc = "0.2"
strum = { version = "0.28", features = ["derive"] }

[profile.release]
debug = true
